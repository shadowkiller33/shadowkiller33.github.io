# --------------------------------------------------
#  VISIT LOG (optional)
#  Address of the visit-logger Worker in tools/visit-logger, without a
#  trailing slash, e.g. https://visit-logger.<name>.workers.dev. Leave it empty
#  to turn logging off. When set, the homepage and every blog post record each
#  visit (time, IP address, rough location, network, page, referrer, browser).
#  No page shows a notice. How long visits are kept is set by RETENTION_DAYS
#  in tools/visit-logger/wrangler.toml.
# --------------------------------------------------
visit_logger_url: "https://visit-logger.lingfeng-shen-blog-visit.workers.dev"
#  When true, a post's share image is served through the visit logger, so each
#  platform that fetches it for a link card is recorded as a link preview. Off:
#  LinkedIn shows no image from a workers.dev address. Turn it on only after
#  giving the Worker a domain of your own (see tools/visit-logger/README.md).
visit_logger_previews: false


