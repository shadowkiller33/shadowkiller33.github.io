---
layout: default
---
<article class="wrap page">
  <header class="page-header">
    {%- if page.eyebrow %}
    <p class="eyebrow">{{ page.eyebrow }}</p>
    {%- endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if page.subtitle %}
    <p class="page-subtitle">{{ page.subtitle }}</p>
    {%- endif %}
  </header>

  <div class="{% if page.sections %}sections{% else %}prose{% endif %}">
    {{ content }}
  </div>
</article>
