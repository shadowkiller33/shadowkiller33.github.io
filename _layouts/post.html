---
layout: default
---
<article class="wrap page post">
  <header class="page-header">
    <p class="eyebrow"><a href="{{ '/blogs/' | relative_url }}">{{ site.blog_title | default: "Blog" }}</a></p>
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if page.date %}
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %Y" }}</time></p>
    {%- endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>

  {%- if page.disclaimer %}
  <aside class="note">{{ page.disclaimer }}</aside>
  {%- endif %}

  <p class="back-link"><a href="{{ '/blogs/' | relative_url }}"><span aria-hidden="true">←</span> All posts</a></p>
</article>
