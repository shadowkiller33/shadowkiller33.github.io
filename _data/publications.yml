# Publications, grouped as in the CV and listed newest first within each group.
#
# Each group has a name, an optional home_title (its heading on the homepage), an
# optional note (shown on the Publications page) and papers:
#   title       paper title
#   authors     your own name is highlighted automatically; "*" marks equal contribution
#   venue       short label shown as a badge, e.g. ICML 2024
#   venue_full  full venue name, shown on the Publications page
#   note        optional second badge; "Oral" is highlighted, anything else is neutral
#   url         where the title and the link point
#   link_label  text of the link (default: Paper)
#   selected    true = also listed on the homepage

