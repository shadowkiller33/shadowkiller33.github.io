{% capture url %}{{ page.url | remove:'index.html' }}{% endcapture %}
<nav id="navbar" class="navbar navbar-light navbar-expand-sm fixed-top">
  <div class="container">

    <div class="navbar-brand social">
      {% include social.html %}
    </div>

    <button class="navbar-toggler collapsed ml-auto" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="sr-only">Toggle navigation</span>
      <span class="icon-bar top-bar"></span>
      <span class="icon-bar middle-bar"></span>
      <span class="icon-bar bottom-bar"></span>
    </button>

    <div class="collapse navbar-collapse text-right" id="navbarNav">
      <ul class="navbar-nav ml-auto flex-nowrap">
        {% for link in site.links %}
        <li class="nav-item{% if url == link.url %} active{% endif %}">
          <a class="nav-link" href="{{ site.url }}{{ link.url }}">{{ link.title }}{% if url == link.url %}<span class="sr-only">(current)</span>{% endif %}</a>
        </li>
        {% endfor %}
      </ul>
    </div>

  </div>
</nav>
