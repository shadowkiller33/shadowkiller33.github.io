<ol class="timeline">
{%- for item in site.data.experience %}
  <li class="timeline-item{% if item.dates contains 'Present' %} is-current{% endif %}">
    <div class="timeline-date">{{ item.dates }}</div>
    <div class="timeline-body">
      <div class="timeline-title">{{ item.title }}</div>
      <div class="timeline-org">{% if item.url %}<a href="{{ item.url }}">{{ item.org }}</a>{% else %}{{ item.org }}{% endif %}</div>
      {%- if item.desc %}
      <p class="timeline-desc">{{ item.desc }}</p>
      {%- endif %}
    </div>
  </li>
{%- endfor %}
</ol>
