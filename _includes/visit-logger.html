{%- comment -%}
  Records a visit to a blog post with the visit-logger Worker (tools/visit-logger).
  Turned on by visit_logger_url in _config.yml; renders nothing when it is empty.
{%- endcomment -%}
{%- if site.visit_logger_url and site.visit_logger_url != "" %}
<script>
  (function () {
    var post = document.querySelector("article.post");
    var data = JSON.stringify({
      path: location.pathname,
      lang: (post && post.getAttribute("data-lang")) || "en",
      referrer: document.referrer || ""
    });
    var url = {{ site.visit_logger_url | append: "/hit" | jsonify }};
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(url, new Blob([data], { type: "text/plain" }))) return;
    } catch (e) {}
    try { fetch(url, { method: "POST", body: data, keepalive: true, mode: "no-cors" }); } catch (e) {}
  })();
</script>
{%- endif %}
